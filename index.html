<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Pic Frame</title>
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF;
      padding: 32px;
      min-height: 100vh;
    }

    /* Layout container */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Controls panel — two rows */
    .controls-panel {
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      margin-bottom: 24px;
      overflow: hidden;
    }

    /* Row shared styles */
    .controls-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
    }

    .controls-row + .controls-row {
      border-top: 1px solid #E5E7EB;
    }

    /* Frame row — allow wrapping if many frames */
    .frames-row {
      flex-wrap: wrap;
      gap: 8px 12px;
    }

    /* Control groups */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .control-group label {
      font-size: 14px;
      font-weight: 400;
      color: #1F2937;
      line-height: 1.5;
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: #FFFFFF;
      background: #FF6B35;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #E55A28;
    }

    button:active {
      transform: translateY(1px);
    }

    /* Hidden file input */
    #photo-upload {
      display: none;
    }

    /* Frame picker */
    .frames-row-label {
      font-size: 14px;
      font-weight: 400;
      color: #1F2937;
      white-space: nowrap;
      margin-right: 4px;
    }

    .frame-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .frame-thumbnail {
      width: 80px;
      height: 80px;
      border: 2px solid #E5E7EB;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s ease;
      background: #F5F5F5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #9CA3AF;
      text-align: center;
      padding: 4px;
      overflow: hidden;
      flex-shrink: 0;
    }

    .frame-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 2px;
    }

    .frame-thumbnail:hover {
      border-color: #FF6B35;
    }

    .frame-thumbnail.active {
      border-color: #FF6B35;
      border-width: 2px;
    }

    /* Range sliders */
    input[type="range"] {
      width: 150px;
      accent-color: #FF6B35;
      cursor: pointer;
    }

    /* Canvas container */
    #stage-container {
      width: 500px;
      height: 500px;
      margin: 0 auto;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Spacer to push download button to the right */
    .spacer {
      flex-grow: 1;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Controls Panel (two rows) -->
    <div class="controls-panel">

      <!-- Row 1: Frame Picker (populated dynamically by JS) -->
      <div class="controls-row frames-row">
        <span class="frames-row-label">Choose Frame</span>
        <div id="frame-picker" class="frame-picker">
          <!-- Thumbnails injected here by discoverFrames() -->
        </div>
      </div>

      <!-- Row 2: Upload, Sliders, Download -->
      <div class="controls-row">
        <!-- Upload Button -->
        <div class="control-group">
          <button id="upload-btn">Upload Photo</button>
          <input type="file" id="photo-upload" accept="image/png, image/jpeg">
        </div>

        <!-- Photo Size Slider -->
        <div class="control-group">
          <label for="photo-scale">Photo Size</label>
          <input type="range" id="photo-scale" min="0.5" max="2" step="0.1" value="1">
        </div>

        <!-- Frame Size Slider -->
        <div class="control-group" style="display:none">
          <label for="frame-scale">Frame Size</label>
          <input type="range" id="frame-scale" min="0.5" max="2" step="0.1" value="1">
        </div>

        <!-- Spacer -->
        <div class="spacer"></div>

        <!-- Download Button -->
        <div class="control-group">
          <button id="download-btn">Download</button>
        </div>
      </div>

    </div>

    <!-- Canvas -->
    <div id="stage-container"></div>
  </div>

  <!-- Konva.js Library -->
  <script src="konva.min.js"></script>

  <!-- Application JavaScript -->
  <script>
    // App state object (module scope)
    const state = {
      photoImage: null,      // Konva.Image node for user's photo
      frameImage: null,      // Konva.Image node for selected frame
      photoScale: 1,         // Scale factor for photo (0.5 to 2.0)
      frameScale: 1,         // Scale factor for frame (0.5 to 2.0)
      selectedFrame: null    // Which frame is active (null, 'frame-1', 'frame-2', 'frame-3', ...)
    };

    // Initialize Konva Stage
    const stage = new Konva.Stage({
      container: 'stage-container',
      width: 500,
      height: 500,
    });

    // Create two layers (photo below, frame above)
    const photoLayer = new Konva.Layer();
    const frameLayer = new Konva.Layer();

    stage.add(photoLayer);  // Add photo layer first (renders below)
    stage.add(frameLayer);  // Add frame layer second (renders above)

    // Empty state: gray background
    const background = new Konva.Rect({
      x: 0,
      y: 0,
      width: 500,
      height: 500,
      fill: '#F5F5F5',
    });
    photoLayer.add(background);

    // Empty state: placeholder text
    const placeholderText = new Konva.Text({
      text: 'Upload a photo to get started',
      fontSize: 14,
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
      fill: '#9CA3AF',
      width: 500,
      align: 'center',
      x: 0,
      y: 242,  // Vertically centered (500/2 - 14/2 ≈ 242)
    });
    photoLayer.add(placeholderText);

    // Initial render
    photoLayer.draw();
    frameLayer.draw();

    // Load frame PNG onto frameLayer (Phase 2)
    function loadFrame(frameId, src) {
      Konva.Image.fromURL(src, function(frameNode) {
        // D-04: Remove old frame if exists
        if (state.frameImage) {
          state.frameImage.destroy();
        }

        // D-05: Frame fills 500×500 stage at top-left
        frameNode.position({ x: 0, y: 0 });
        frameNode.width(500);
        frameNode.height(500);

        // D-11: Update state
        frameLayer.add(frameNode);
        state.frameImage = frameNode;
        state.selectedFrame = frameId;

        frameLayer.draw();
      });
    }

    // Dynamically discover frame-N.png files and build thumbnails
    // Probes frame-1 through frame-9; stops at first missing file
    function discoverFrames() {
      const picker = document.getElementById('frame-picker');
      let index = 1;
      const maxFrames = 9; // Stop at 9 to prevent infinite probing

      function probeNext() {
        if (index > maxFrames) return; // Guard against infinite loop

        const frameId = 'frame-' + index;
        const src = frameId + '.png';
        const img = new Image();

        img.onload = function() {
          const thumb = document.createElement('div');
          thumb.id = frameId + '-thumb';
          thumb.className = 'frame-thumbnail';
          thumb.dataset.frame = frameId;

          const imgEl = document.createElement('img');
          imgEl.src = src;
          imgEl.alt = 'Frame ' + index;
          thumb.appendChild(imgEl);

          thumb.addEventListener('click', function() {
            document.querySelectorAll('.frame-thumbnail').forEach(function(t) {
              t.classList.remove('active');
            });
            thumb.classList.add('active');

            // Phase 2: Load frame onto canvas
            loadFrame(frameId, src);
          });

          picker.appendChild(thumb);
          index++;
          probeNext();
        };

        img.onerror = function() {
          // No more frames at this index — stop probing
        };

        img.src = src;
      }

      probeNext();
    }

    discoverFrames();

    // Wire upload button to trigger file input (Phase 2 will implement the actual handler)
    document.getElementById('upload-btn').addEventListener('click', function() {
      document.getElementById('photo-upload').click();
    });

    // Photo upload handler (Phase 2)
    document.getElementById('photo-upload').addEventListener('change', function(event) {
      const file = event.target.files[0];
      if (!file) return; // User cancelled picker

      // D-07: Silent MIME validation (ignore non-JPEG/PNG files)
      if (file.type !== 'image/jpeg' && file.type !== 'image/png') {
        return; // Silent ignore per D-07
      }

      const reader = new FileReader();

      reader.onload = function(e) {
        const dataURL = e.target.result;

        Konva.Image.fromURL(dataURL, function(imageNode) {
          // D-08: Remove old photo if exists (replacement behavior)
          if (state.photoImage) {
            state.photoImage.destroy();
          }

          // D-01: Center at natural pixel size on 500×500 stage
          imageNode.position({ x: 250, y: 250 });
          imageNode.offset({
            x: imageNode.width() / 2,
            y: imageNode.height() / 2
          });

          // D-10: Hide empty state
          background.visible(false);
          placeholderText.visible(false);

          // Add to layer and update state
          photoLayer.add(imageNode);
          state.photoImage = imageNode;

          // Reset slider to default scale (per D-08)
          document.getElementById('photo-scale').value = 1;
          state.photoScale = 1;
          imageNode.scaleX(1);
          imageNode.scaleY(1);

          photoLayer.draw();

          // Reset input to allow re-uploading same file
          event.target.value = '';
        });
      };

      reader.onerror = function(e) {
        console.error('FileReader error:', e);
        // Reset input even on error
        event.target.value = '';
      };

      reader.readAsDataURL(file);
    });

    // Wire Photo Size slider for real-time scaling (Phase 3)
    const photoSlider = document.getElementById('photo-scale');

    photoSlider.addEventListener('input', function(event) {
      const scale = parseFloat(event.target.value); // 0.5 to 2.0
      const imageNode = state.photoImage;

      // Guard: no photo loaded yet
      if (!imageNode) return;

      // Apply uniform scale (preserves aspect ratio per EDT-01)
      imageNode.scaleX(scale);
      imageNode.scaleY(scale);

      // Recalculate offset to maintain centered position (per D-04)
      const naturalWidth = imageNode.width();   // Original pixel width (no scale)
      const naturalHeight = imageNode.height(); // Original pixel height (no scale)

      imageNode.offset({
        x: naturalWidth * scale / 2,
        y: naturalHeight * scale / 2
      });

      // Update state (per D-06)
      state.photoScale = scale;

      // Redraw with frame-rate throttling (per D-10)
      photoLayer.batchDraw();
    });

    // Log initialization success
    console.log('Konva Stage initialized:', {
      width: stage.width(),
      height: stage.height(),
      layers: stage.children.length,
      photoLayerNodes: photoLayer.children.length,
      frameLayerNodes: frameLayer.children.length
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile Pic Frame</title>
  <style>
    /* Reset and base styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #FFFFFF;
      padding: 32px;
      min-height: 100vh;
    }

    /* Layout container */
    .app-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* Controls bar */
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 16px;
      background: #FFFFFF;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      margin-bottom: 24px;
    }

    /* Control groups */
    .control-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .control-group label {
      font-size: 14px;
      font-weight: 400;
      color: #1F2937;
      line-height: 1.5;
    }

    /* Buttons */
    button {
      font-family: inherit;
      font-size: 16px;
      font-weight: 600;
      line-height: 1.5;
      color: #FFFFFF;
      background: #FF6B35;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    button:hover {
      background: #E55A28;
    }

    button:active {
      transform: translateY(1px);
    }

    /* Hidden file input */
    #photo-upload {
      display: none;
    }

    /* Frame picker */
    .frame-picker {
      display: flex;
      gap: 8px;
    }

    .frame-thumbnail {
      width: 80px;
      height: 80px;
      border: 2px solid #E5E7EB;
      border-radius: 4px;
      cursor: pointer;
      transition: border-color 0.2s ease;
      background: #F5F5F5;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #9CA3AF;
      text-align: center;
      padding: 8px;
    }

    .frame-thumbnail:hover {
      border-color: #FF6B35;
    }

    .frame-thumbnail.active {
      border-color: #FF6B35;
      border-width: 2px;
    }

    /* Range sliders */
    input[type="range"] {
      width: 150px;
      accent-color: #FF6B35;
      cursor: pointer;
    }

    /* Canvas container */
    #stage-container {
      width: 500px;
      height: 500px;
      margin: 0 auto;
      border: 1px solid #E5E7EB;
      border-radius: 8px;
      overflow: hidden;
    }

    /* Spacer to push download button to the right */
    .spacer {
      flex-grow: 1;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Controls Bar -->
    <div class="controls-bar">
      <!-- Upload Button -->
      <div class="control-group">
        <button id="upload-btn">Upload Photo</button>
        <input type="file" id="photo-upload" accept="image/png, image/jpeg">
      </div>

      <!-- Frame Picker -->
      <div class="control-group">
        <label>Choose Frame</label>
        <div class="frame-picker">
          <div id="frame-1-thumb" class="frame-thumbnail">Frame 1</div>
          <div id="frame-2-thumb" class="frame-thumbnail">Frame 2</div>
        </div>
      </div>

      <!-- Photo Size Slider -->
      <div class="control-group">
        <label for="photo-scale">Photo Size</label>
        <input type="range" id="photo-scale" min="0.5" max="2" step="0.1" value="1">
      </div>

      <!-- Frame Size Slider -->
      <div class="control-group">
        <label for="frame-scale">Frame Size</label>
        <input type="range" id="frame-scale" min="0.5" max="2" step="0.1" value="1">
      </div>

      <!-- Spacer -->
      <div class="spacer"></div>

      <!-- Download Button -->
      <div class="control-group">
        <button id="download-btn">Download</button>
      </div>
    </div>

    <!-- Canvas -->
    <div id="stage-container"></div>
  </div>

  <!-- Konva.js Library -->
  <script src="konva.min.js"></script>

  <!-- Application JavaScript -->
  <script>
    // App state object (module scope)
    const state = {
      photoImage: null,      // Konva.Image node for user's photo
      frameImage: null,      // Konva.Image node for selected frame
      photoScale: 1,         // Scale factor for photo (0.5 to 2.0)
      frameScale: 1,         // Scale factor for frame (0.5 to 2.0)
      selectedFrame: null    // Which frame is active (null, 'frame-1', 'frame-2')
    };

    // Initialize Konva Stage
    const stage = new Konva.Stage({
      container: 'stage-container',
      width: 500,
      height: 500,
    });

    // Create two layers (photo below, frame above)
    const photoLayer = new Konva.Layer();
    const frameLayer = new Konva.Layer();

    stage.add(photoLayer);  // Add photo layer first (renders below)
    stage.add(frameLayer);  // Add frame layer second (renders above)

    // Empty state: gray background
    const background = new Konva.Rect({
      x: 0,
      y: 0,
      width: 500,
      height: 500,
      fill: '#F5F5F5',
    });
    photoLayer.add(background);

    // Empty state: placeholder text
    const placeholderText = new Konva.Text({
      text: 'Upload a photo to get started',
      fontSize: 14,
      fontFamily: '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
      fill: '#9CA3AF',
      width: 500,
      align: 'center',
      x: 0,
      y: 242,  // Vertically centered (500/2 - 14/2 ≈ 242)
    });
    photoLayer.add(placeholderText);

    // Initial render
    photoLayer.draw();
    frameLayer.draw();

    // Wire upload button to trigger file input (Phase 2 will implement the actual handler)
    document.getElementById('upload-btn').addEventListener('click', function() {
      document.getElementById('photo-upload').click();
    });

    // Log initialization success
    console.log('Konva Stage initialized:', {
      width: stage.width(),
      height: stage.height(),
      layers: stage.children.length,
      photoLayerNodes: photoLayer.children.length,
      frameLayerNodes: frameLayer.children.length
    });
  </script>
</body>
</html>
